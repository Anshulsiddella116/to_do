<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — TO DO :)</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23426b50%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27sans-serif%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3E%3A)%3C/text%3E%3C/svg%3E"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#293c30;font:14px 'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;padding:25px}.layout{display:grid;grid-template-columns:1fr 1fr;width:min(920px,100%);border:1px solid #e3e8dc;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 20px 70px #2f4a3010}.story{background:#edf2e6;padding:55px 42px;display:flex;flex-direction:column;justify-content:space-between;position:relative}.brand{font:800 29px Manrope,sans-serif;letter-spacing:-1.5px}.brand span{color:#6b8856}.story h1{font:700 37px/1.25 Manrope;letter-spacing:-1.3px;margin:65px 0 18px}.story p{color:#849276;line-height:1.9;max-width:270px}.leaves{font-size:75px;color:#a0b18a;text-align:right;line-height:1}.story small{font-size:10px;color:#97a389;margin-top:40px}.form-wrap{padding:55px 40px}.tabs{display:flex;background:#f5f7f1;border-radius:9px;padding:4px;margin-bottom:31px}.tab{flex:1;background:none;border:0;padding:10px;border-radius:7px;font:500 12px 'DM Sans';color:#98a08f;cursor:pointer}.tab.active{background:#fff;color:#426b50;box-shadow:0 1px 5px #0001}h2{font:800 24px Manrope;letter-spacing:-.7px;margin:0 0 9px}.sub{font-size:12px;color:#8b9682;line-height:1.7;margin-bottom:23px}label{display:block;font-size:11px;color:#6d7f62;margin:18px 0 8px}input{width:100%;border:1px solid #dfe6d7;border-radius:8px;padding:12px;background:#fcfdf9;font:14px 'DM Sans';color:#293c30}input:focus{outline:2px solid #aabd96;outline-offset:2px}.submit{width:100%;border:0;background:#426b50;color:white;border-radius:8px;padding:13px;margin-top:24px;font:600 12px 'DM Sans';cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.note{font-size:10px;color:#9aa591;text-align:center;line-height:1.8;margin-top:20px}.error{font-size:12px;line-height:1.7;color:#ac5d49;margin-top:15px;overflow-wrap:anywhere}.password-wrap{position:relative}.password-wrap input{padding-right:57px}.show{position:absolute;right:10px;top:12px;border:0;background:none;color:#8b9b7c;cursor:pointer;font-size:10px}button:focus-visible{outline:2px solid #8ca47a;outline-offset:3px}[hidden]{display:none!important}@media(max-width:650px){body{padding:18px}.layout{grid-template-columns:1fr;max-width:440px}.story{padding:25px 28px}.story h1{font-size:24px;margin:18px 0 0}.story p,.leaves,.story small{display:none}.form-wrap{padding:27px}}
</style></head><body><main class="layout"><section class="story"><div><div class="brand">TO DO <span>:)</span></div><h1>A little progress,<br>together.</h1><p>Your goals, your people. Make room for the things that matter.</p></div><div class="leaves" aria-hidden="true">❧</div><small>Small steps. Shared goals. Good company.</small></section><section class="form-wrap"><div class="tabs" aria-label="Account action"><button class="tab active" id="signInTab" type="button" aria-pressed="true">Sign in</button><button class="tab" id="signUpTab" type="button" aria-pressed="false">Create account</button></div><h2 id="heading">Welcome back.</h2><p class="sub" id="subtitle">Your next little win is waiting.</p><form id="accountForm"><div id="nameWrap" hidden><label for="name">Your name</label><input id="name" name="name" maxlength="40" autocomplete="name" placeholder="What should we call you?"></div><label for="email">Email address</label><input type="email" id="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="Enter your password"><button type="button" id="showPassword" class="show" aria-label="Show password">Show</button></div><div class="error" id="error" role="alert"></div><button type="submit" class="submit" id="submit" disabled>Sign in →</button></form><p class="note" id="note">A shared space to get things done.</p></section></main><script>
let mode='login',csrf='';const $=s=>document.querySelector(s);
function setMode(next){mode=next;$('#nameWrap').hidden=next==='login';$('#name').required=next==='signup';$('#password').minLength=next==='signup'?10:1;$('#password').autocomplete=next==='signup'?'new-password':'current-password';$('#heading').textContent=next==='signup'?'Good things start here.':'Welcome back.';$('#subtitle').textContent=next==='signup'?'Create your account and start making progress.':'Your next little win is waiting.';$('#submit').textContent=next==='signup'?'Create account →':'Sign in →';$('#note').textContent=next==='signup'?'Use a password of at least 10 characters.':'A shared space to get things done.';$('#error').textContent='';for(const id of ['signInTab','signUpTab']){const active=(id==='signInTab')===(next==='login');$('#'+id).classList.toggle('active',active);$('#'+id).setAttribute('aria-pressed',active)} }
$('#signInTab').onclick=()=>setMode('login');$('#signUpTab').onclick=()=>setMode('signup');$('#showPassword').onclick=()=>{const show=$('#password').type==='password';$('#password').type=show?'text':'password';$('#showPassword').textContent=show?'Hide':'Show';$('#showPassword').setAttribute('aria-label',show?'Hide password':'Show password')};
async function init(){const response=await fetch('/api/auth'),data=await response.json();if(!response.ok)throw Error(data.error||'Could not initialize sign in.');if(data.authenticated){location.replace('/');return}csrf=data.csrf;$('#submit').disabled=false}
$('#accountForm').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#error').textContent='';try{const data=Object.fromEntries(new FormData(e.target));const response=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'Please try again.');location.replace('/')}catch(error){$('#error').textContent=error.message;$('#submit').disabled=false}};
init().catch(error=>{$('#error').textContent=error.message});
</script></body></html>
