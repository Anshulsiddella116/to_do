<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do :) Rooms</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3dfd3;--acc:#2f6fed;--accink:#fff;--ok:#2e9e5b;--bad:#c9372c;--track:#e8e4d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e2330;--ink:#eceef4;--mute:#98a0b3;--line:#2c3345;--acc:#6b9bff;--accink:#0d1220;--ok:#4cc27f;--bad:#ff7a6e;--track:#2c3345}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e2330;--ink:#eceef4;--mute:#98a0b3;--line:#2c3345;--acc:#6b9bff;--accink:#0d1220;--ok:#4cc27f;--bad:#ff7a6e;--track:#2c3345}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 30px/1.1 "Segoe Print","Comic Sans MS",cursive,system-ui;margin:8px 0 4px;text-decoration:underline wavy var(--line);text-underline-offset:8px}
h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--mute);margin:12px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.full{width:100%;margin-top:14px}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mute{color:var(--mute);font-size:14px}
.room{display:block;width:100%;text-align:left;margin-bottom:10px}
.room b{display:block}
.bar{height:14px;background:var(--track);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
.big .bar{height:20px}
.chip{display:inline-block;background:var(--bg);border:1px dashed var(--mute);border-radius:8px;padding:3px 9px;font:600 15px ui-monospace,Menlo,monospace;letter-spacing:1px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}
.todo .t{flex:1;word-break:break-word}
.todo.done .t{text-decoration:line-through;color:var(--mute)}
.chk{width:26px;height:26px;padding:0;border-radius:7px;flex:none;line-height:1}
.todo.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.x{padding:4px 9px;color:var(--bad)}
.danger{color:var(--bad);border-color:var(--bad)}
.danger.p{background:var(--bad);color:#fff}
#del{text-align:center;margin-top:18px}
#del .row{justify-content:center}
.empty{color:var(--mute);text-align:center;padding:16px 0}

.danger{color:var(--bad);border-color:var(--bad)}.danger.p{background:var(--bad);color:#fff}
#del{text-align:center;margin-top:18px}#del .row{justify-content:center}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app=document.getElementById("app"),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem("token"),me=localStorage.getItem("user"),mode="login",timer=null,room=null,confirmDel=false;

async function api(method,url,body){
  const r=await fetch("/api"+url,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&token&&!url.startsWith("/login")&&!url.startsWith("/signup")){logout()}const e=new Error(j.error||"Something went wrong");e.status=r.status;throw e}
  return j;
}
const pct=t=>t.length?Math.round(t.filter(x=>x.done).length/t.length*100):0;
const progressHTML=t=>`<div class="bar"><i style="width:${pct(t)}%"></i></div><div class="mute">${t.filter(x=>x.done).length} of ${t.length} done · ${pct(t)}%</div>`;
const say=(id,m)=>{const e=$(id);if(e)e.textContent=m};
function stopPolling(){if(timer){clearInterval(timer);timer=null}}

/* ---------- auth ---------- */
function authView(){
  stopPolling();
  app.innerHTML=`<h1>To Do :)</h1><p class="sub">Make a room, tick things off, and let friends watch your progress.</p>
  <div class="card"><div class="tabs"><button data-m="login" class="${mode==="login"?"on":""}">Log in</button><button data-m="signup" class="${mode==="signup"?"on":""}">Sign up</button></div>
  <label for="u">Username</label><input id="u" autocomplete="username" maxlength="20" placeholder="letters, numbers, _">
  <label for="p">Password</label><input id="p" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}" placeholder="min 6 characters">
  ${mode==="signup"?`<label for="p2">Confirm password</label><input id="p2" type="password" autocomplete="new-password">`:""}
  <div class="err" id="err"></div><button class="p full" id="go">${mode==="login"?"Log in":"Create account"}</button></div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;authView()});
  $("go").onclick=submitAuth;
  app.querySelectorAll("input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")submitAuth()});
}
async function submitAuth(){
  const username=$("u").value.trim().toLowerCase(),password=$("p").value;
  if(mode==="signup"&&$("p2").value!==password)return say("err","Passwords don’t match.");
  $("go").disabled=true;say("err","");
  try{
    const r=await api("POST","/"+mode,{username,password});
    token=r.token;me=r.username;localStorage.setItem("token",token);localStorage.setItem("user",me);home();
  }catch(e){$("go").disabled=false;say("err",e.message)}
}
function logout(){stopPolling();token=me=null;localStorage.removeItem("token");localStorage.removeItem("user");authView()}

/* ---------- home ---------- */
const roomBtn=(r,prog,own)=>`<button class="room card" data-id="${esc(r.id)}"><b>${esc(r.name)}</b><span class="mute">ID ${esc(r.id)}${own?"":" · by "+esc(r.owner)}</span>${prog?progressHTML(r.todos):""}</button>`;
async function home(){
  stopPolling();room=null;
  app.innerHTML=`<div class="top"><h1>To Do :)</h1><button id="lo">Log out</button></div>
  <p class="sub">Hi, <b>${esc(me)}</b> 👋</p>
  <h2>My rooms</h2><div id="mine"><div class="empty">Loading…</div></div>
  <div class="card"><label for="rn">New room name</label><div class="row"><input id="rn" maxlength="40" placeholder="e.g. Exam prep"><button class="p" id="mk">Create</button></div><div class="err" id="err1"></div></div>
  <h2>Join a friend’s room</h2>
  <div class="card"><label for="ji">Room ID</label><input id="ji" maxlength="6" placeholder="6-character ID" style="text-transform:uppercase">
  <label for="jn">Room name</label><input id="jn" maxlength="40" placeholder="Exact room name">
  <div class="err" id="err2"></div><button class="p full" id="jo">Join room</button></div>
  <div id="joined"></div>`;
  $("lo").onclick=logout;$("mk").onclick=createRoom;$("jo").onclick=joinRoom;
  $("rn").onkeydown=e=>{if(e.key==="Enter")createRoom()};
  const wire=el=>el.querySelectorAll(".room").forEach(b=>b.onclick=()=>openRoom(b.dataset.id));
  try{
    const [mine,joined]=await Promise.all([api("GET","/rooms/mine"),api("GET","/rooms/joined")]);
    if(!$("mine"))return;
    $("mine").innerHTML=mine.length?mine.map(r=>roomBtn(r,true,true)).join(""):`<div class="empty">No rooms yet — create one below.</div>`;wire($("mine"));
    if(joined.length){$("joined").innerHTML=`<h2>Rooms I joined</h2>`+joined.map(r=>roomBtn(r,true,false)).join("");wire($("joined"))}
  }catch(e){if($("mine"))$("mine").innerHTML=`<div class="empty">Couldn’t load rooms.</div>`}
}
async function createRoom(){
  const name=$("rn").value.trim();if(!name)return say("err1","Give your room a name.");
  $("mk").disabled=true;
  try{const r=await api("POST","/rooms",{name});openRoom(r.id)}catch(e){say("err1",e.message);$("mk").disabled=false}
}
async function joinRoom(){
  const id=$("ji").value.trim(),name=$("jn").value.trim();
  if(!id||!name)return say("err2","Enter both the Room ID and the Room name.");
  $("jo").disabled=true;
  try{const r=await api("POST","/rooms/join",{id,name});openRoom(r.id)}catch(e){say("err2",e.message);$("jo").disabled=false}
}

/* ---------- room ---------- */
async function openRoom(id){
  stopPolling();room=null;confirmDel=false;
  app.innerHTML=`<div class="top"><button id="bk">← Back</button><button id="lo">Log out</button></div>
  <div class="card big" style="margin-top:14px"><div id="meta" class="mute">Loading…</div><div id="prog"></div></div>
  <div id="add"></div><div class="card" id="list"></div><div id="del"></div>`;
  $("bk").onclick=home;$("lo").onclick=logout;
  const load=async()=>{
    try{room=await api("GET","/rooms/"+id);drawRoom()}
    catch(e){stopPolling();if($("meta"))$("meta").textContent=e.message}
  };
  await load();
  timer=setInterval(load,3000); // friends see progress update live
}
function drawRoom(){
  if(!$("meta"))return;
  const own=room.isOwner,t=room.todos;
  $("meta").innerHTML=`<div style="font-size:20px;font-weight:700;color:var(--ink)">${esc(room.name)}</div>
   <div style="margin:6px 0">Room ID <span class="chip">${esc(room.id)}</span></div>
   <div>${own?"Your room — share the ID and name with friends":"Owner: "+esc(room.owner)+" · view only"}</div>`;
  $("prog").innerHTML=progressHTML(t);
  if(own&&!$("ti")){
    $("add").innerHTML=`<div class="card"><div class="row"><input id="ti" maxlength="120" placeholder="Add a task…"><button class="p" id="ta">Add</button></div></div>`;
    $("ta").onclick=addTodo;$("ti").onkeydown=e=>{if(e.key==="Enter")addTodo()};
  }
  $("list").innerHTML=t.length?t.map(x=>`<div class="todo ${x.done?"done":""}"><button class="chk" data-t="${x.id}" ${own?"":"disabled"} aria-label="Toggle">${x.done?"✓":""}</button><span class="t">${esc(x.text)}</span>${own?`<button class="x" data-d="${x.id}" aria-label="Delete">✕</button>`:""}</div>`).join(""):`<div class="empty">No tasks yet.</div>`;
  $("list").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>act("PATCH","/todos/"+b.dataset.t,{done:!room.todos.find(x=>String(x.id)===b.dataset.t).done}));
  $("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>act("DELETE","/todos/"+b.dataset.d));
  drawDel(own);
}
async function act(method,sub,body){
  try{await api(method,"/rooms/"+room.id+sub,body);room=await api("GET","/rooms/"+room.id);drawRoom()}
  catch(e){$("meta").insertAdjacentHTML("beforeend",`<div class="err">${esc(e.message)}</div>`)}
}
function addTodo(){const i=$("ti"),v=i.value.trim();if(!v)return;i.value="";act("POST","/todos",{text:v})}
function drawDel(own){
  const el=$("del");if(!el)return;if(!own){el.innerHTML="";return}
  el.innerHTML=confirmDel
    ?`<div class="mute" style="margin-bottom:8px">Delete “${esc(room.name)}” for everyone? This can’t be undone.</div><div class="row"><button class="danger p" id="dy">Yes, delete</button><button id="dn">Cancel</button></div>`
    :`<button class="danger" id="dr">Delete room</button>`;
  if(confirmDel){$("dy").onclick=async()=>{stopPolling();try{await api("DELETE","/rooms/"+room.id);home()}catch(e){say("meta",e.message)}};$("dn").onclick=()=>{confirmDel=false;drawDel(true)}}
  else $("dr").onclick=()=>{confirmDel=true;drawDel(true)};
}

/* ---------- boot ---------- */
token&&me?home():authView();
</script>
</body>
</html>
